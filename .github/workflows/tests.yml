name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@9ffcbcc2c89631400988e8d4b1e3ac17dbbe3fe9 # main

      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit and style check
        run: |
          brew test-bot --only-cleanup-before
          brew test-bot --only-setup
          brew test-bot --only-tap-syntax

  # Runs bump-formula.sh and latest-release.sh against local release folders
  # and a stub gh, then checks the style of the formulas a release writes.
  bump-script:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@9ffcbcc2c89631400988e8d4b1e3ac17dbbe3fe9 # main

      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The cleanup removes files git does not track, so the test runs after
      # it and leaves the formulas a release writes, Formula/pbtop.rb included.
      - name: Test bump-formula.sh and style check what it writes
        run: |
          brew test-bot --only-cleanup-before
          brew test-bot --only-setup
          .github/scripts/test-bump-formula.sh --keep
          brew test-bot --only-tap-syntax

  install:
    # Runs alongside syntax, not after it: the 65s style audit no longer sits
    # in front of the install legs. Both are still required checks.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@9ffcbcc2c89631400988e8d4b1e3ac17dbbe3fe9 # main

      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Link the checkout as the tap
        run: |
          tap_dir="$(brew --repository)/Library/Taps/pragmatic-engineer"
          mkdir -p "$tap_dir"
          rm -rf "$tap_dir/homebrew-tap"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir/homebrew-tap"

      - name: Audit, install and test every formula
        run: |
          set -euo pipefail
          # Each formula is removed after its test, since pbtop and
          # playbook-telemetry both install pbtop and conflict.
          for f in Formula/*.rb; do
            name="$(basename "$f" .rb)"
            brew audit --strict --online "pragmatic-engineer/tap/${name}"
            brew install --verbose "pragmatic-engineer/tap/${name}"
            brew test "pragmatic-engineer/tap/${name}"
            if [ "$name" = playbook-telemetry ] || [ "$name" = pbtop ]; then
              pbtop --version
            fi
            brew uninstall "pragmatic-engineer/tap/${name}"
          done
