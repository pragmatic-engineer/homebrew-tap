name: release

on:
  schedule:
    # Every 30 minutes. A run with nothing outdated only looks up the
    # latest release of each formula and opens nothing.
    - cron: "7,37 * * * *"
  workflow_dispatch:
  # Optional: anything that sends this event gets an immediate check. The
  # schedule above is what normally picks up a release.
  repository_dispatch:
    types: [tool-released]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    strategy:
      # One formula at a time: each bump branches from the current main.
      max-parallel: 1
      fail-fast: false
      matrix:
        formula: [playbook, playbook-telemetry, pbtop, playbook-code]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Find the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          FORMULA: ${{ matrix.formula }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          info="$(.github/scripts/latest-release.sh "${FORMULA}")"
          if [ -z "$info" ]; then
            echo "${FORMULA} has no release yet. Nothing to do."
            echo "outdated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          read -r source_repo tag_prefix latest <<<"$info"
          # The playbook release workflow opens release/vX.Y.Z here with every
          # formula of a v release (ADR 0039 in pragmatic-engineer/playbook).
          # This run leaves the release to it while that pull request is open,
          # and for the first hour after the release on a scheduled run, when
          # the workflow may not have opened it yet. Once it merges, the
          # formula is current.
          release_owns() {
            local open published age
            open="$(gh pr list --repo "$REPO" --head "release/v$1" --state open --json number --jq '.[0].number // empty')"
            if [ -n "$open" ]; then
              echo "Pull request #${open} from the playbook release updates ${FORMULA} to $1."
              return 0
            fi
            [ "$EVENT" = schedule ] || return 1
            published="$(gh release view "v$1" --repo pragmatic-engineer/playbook --json publishedAt --jq .publishedAt)"
            age=$(( $(date -u +%s) - $(date -u -d "$published" +%s) ))
            if [ "$age" -lt 3600 ]; then
              echo "v$1 was published ${age}s ago. The playbook release workflow updates ${FORMULA}, so this run waits."
              return 0
            fi
            return 1
          }
          echo "source_repo=${source_repo}" >> "$GITHUB_OUTPUT"
          echo "tag_prefix=${tag_prefix}" >> "$GITHUB_OUTPUT"
          current="$(sed -nE 's#.*/download/(telemetry-v|code-v|v)([0-9][0-9.]*)/.*#\2#p' "Formula/${FORMULA}.rb" 2>/dev/null | head -n1 || true)"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          echo "current=${current}" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then
            echo "Formula is current at ${current}."
            echo "outdated=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$current" ] && [ "$(printf '%s\n' "$current" "$latest" | sort -V | tail -n1)" != "$latest" ]; then
            echo "::warning::Formula is at ${current}, newer than the latest release ${latest} found. Not downgrading."
            echo "outdated=false" >> "$GITHUB_OUTPUT"
          elif [ "$source_repo" = playbook ] && [ "$tag_prefix" = v ] && release_owns "$latest"; then
            echo "outdated=false" >> "$GITHUB_OUTPUT"
          else
            echo "Formula is at ${current}, latest release is ${latest}."
            echo "outdated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update the formula from the release checksums
        if: steps.release.outputs.outdated == 'true'
        env:
          VERSION: ${{ steps.release.outputs.latest }}
          FORMULA: ${{ matrix.formula }}
          SOURCE_REPO: ${{ steps.release.outputs.source_repo }}
          TAG_PREFIX: ${{ steps.release.outputs.tag_prefix }}
        run: |
          .github/scripts/bump-formula.sh "$VERSION" "Formula/${FORMULA}.rb"

      - name: Open, check and merge the bump pull request
        if: steps.release.outputs.outdated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.release.outputs.latest }}
          FORMULA: ${{ matrix.formula }}
        run: |
          set -euo pipefail
          FILE_PATH="Formula/${FORMULA}.rb"
          branch="bump/${FORMULA}-v${VERSION}"
          title="chore(deps): bump ${FORMULA} to ${VERSION}"

          # A bump pull request that is still open is left alone: the run
          # that opened it, or a person, finishes it. Without this, a release
          # whose tests keep failing would close and reopen its pull request
          # on every scheduled run.
          open_pr="$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$open_pr" ]; then
            echo "::warning::pull request #${open_pr} for ${branch} is still open. Leaving it for a person or the next run after it closes."
            exit 0
          fi

          # Drop a branch left behind by a failed run.
          if gh api "repos/${REPO}/git/ref/heads/${branch}" >/dev/null 2>&1; then
            gh api -X DELETE "repos/${REPO}/git/refs/heads/${branch}"
          fi

          # GitHub signs commits made through createCommitOnBranch.
          head="$(gh api "repos/${REPO}/git/ref/heads/main" --jq .object.sha)"
          gh api -X POST "repos/${REPO}/git/refs" -f "ref=refs/heads/${branch}" -f "sha=${head}" >/dev/null
          jq -n \
            --arg repo "$REPO" --arg branch "$branch" --arg head "$head" --arg msg "$title" \
            --arg path "$FILE_PATH" --arg content "$(base64 < "$FILE_PATH" | tr -d '\n')" \
            '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                message: {headline: $msg},
                expectedHeadOid: $head,
                fileChanges: {additions: [{path: $path, contents: $content}]}
              }}}' > "$RUNNER_TEMP/payload.json"
          oid="$(gh api graphql --input "$RUNNER_TEMP/payload.json" --jq '.data.createCommitOnBranch.commit.oid // empty')"
          if [ -z "$oid" ]; then
            echo "::error::the API did not create the commit. main may have moved since this run started. The next run retries." >&2
            exit 1
          fi
          echo "Created signed commit ${oid} on ${branch}."

          pr="$(gh api -X POST "repos/${REPO}/pulls" \
            -f "title=${title}" -f "head=${branch}" -f base=main \
            -f "body=Automated bump of the ${FORMULA} pin to ${VERSION}, with URLs and checksums from the release SHA256SUMS, and the caveats breaking changes block from its breaking-changes.json. The playbook release workflow normally makes this change. This run made it because that did not happen within an hour. Squash merged once the checks pass." \
            --jq .number)"
          echo "Opened pull request #${pr}."

          # GITHUB_TOKEN pull requests get their checks run held at action_required.
          run_id=""
          for _ in $(seq 1 36); do
            run_id="$(gh run list --repo "$REPO" --workflow tests.yml --branch "$branch" --event pull_request \
              --json databaseId,headSha --jq "map(select(.headSha == \"${oid}\")) | first | .databaseId // empty")"
            [ -n "$run_id" ] && break
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "::error::the pull request checks run did not appear." >&2
            exit 1
          fi
          echo "Checks run: https://github.com/${REPO}/actions/runs/${run_id}"
          if [ "$(gh api "repos/${REPO}/actions/runs/${run_id}" --jq .conclusion)" = "action_required" ]; then
            gh api -X POST "repos/${REPO}/actions/runs/${run_id}/approve" >/dev/null
            echo "Approved the checks run."
          fi
          gh run watch "$run_id" --repo "$REPO" --exit-status --interval 20

          # The ruleset can lag the finished run and answer 405, so retry.
          for attempt in $(seq 1 20); do
            if gh api -X PUT "repos/${REPO}/pulls/${pr}/merge" \
              -f merge_method=squash -f "commit_title=${title} (#${pr})" -f commit_message= >/dev/null; then
              echo "Merged pull request #${pr}."
              exit 0
            fi
            echo "Merge attempt ${attempt} was refused, retrying in 15s."
            sleep 15
          done
          echo "::error::the pull request could not be merged." >&2
          exit 1
